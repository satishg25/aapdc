---
- name: UC19b provision two Windows Tomcat nodes
  hosts: tomcat_windows_ha
  gather_facts: true
  vars:
    expected_use_case: '19b'
  pre_tasks:
    - name: Confirm UC19b selection
      ansible.builtin.assert:
        that: requested_use_case | string == expected_use_case

  roles:
    - role: shared_role_hooks
      vars:
        shared_role_phase: windows_ha_provisioning_and_baseline
    - role: tomcat_windows

- name: UC19b connect the approved Tomcat HA integration
  hosts: tomcat_windows_ha
  gather_facts: false
  roles:
    - role: tomcat_ha
    - role: shared_role_hooks
      vars:
        shared_role_phase: windows_tomcat_ha_integration
    - role: shared_role_hooks
      vars:
        shared_role_phase: operational_onboarding
    - role: acceptance_validation
      vars:
        validation_profile: tomcat_windows_ha